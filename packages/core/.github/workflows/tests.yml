name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: Core must not pull in any Laravel package
        run: |
          if composer show --name-only | grep -E '^(illuminate|laravel)/'; then
            echo "payments-core depends on Laravel packages"; exit 1
          fi
      - run: vendor/bin/pest
