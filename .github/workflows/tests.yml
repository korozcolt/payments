name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The Laravel package suite must stay green, unmodified, on every supported Laravel.
  laravel:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 10, php: '8.2', testbench: '^8.0',  pest: '^2.0', plugin: '^2.0' }
          - { laravel: 10, php: '8.3', testbench: '^8.0',  pest: '^2.0', plugin: '^2.0' }
          - { laravel: 11, php: '8.2', testbench: '^9.0',  pest: '^3.0', plugin: '^3.0' }
          - { laravel: 11, php: '8.4', testbench: '^9.0',  pest: '^3.0', plugin: '^3.0' }
          - { laravel: 12, php: '8.2', testbench: '^10.0', pest: '^3.0', plugin: '^3.0' }
          - { laravel: 12, php: '8.4', testbench: '^10.0', pest: '^3.0', plugin: '^3.0' }
          - { laravel: 13, php: '8.3', testbench: '^11.0', pest: '^4.0', plugin: '^4.0' }
          - { laravel: 13, php: '8.4', testbench: '^11.0', pest: '^4.0', plugin: '^4.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          # Old Laravel minors carry security advisories; we test compatibility, not recommend them.
          composer config audit.block-insecure false
          composer remove --dev larastan/larastan --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.plugin }}" --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/pest

  # The core must install and pass with NO framework present.
  core:
    name: Core (no Laravel) / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: Core must not pull in any Laravel package
        run: |
          if composer show --name-only | grep -E '^(illuminate|laravel)/'; then
            echo "payments-core depends on Laravel packages"; exit 1
          fi
      - run: vendor/bin/pest

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
